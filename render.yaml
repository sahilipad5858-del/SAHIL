services:
  - type: web
    name: po-mailer
    runtime: python
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      cd ../frontend
      npm install
      npm run build
    startCommand: |
      cd backend
      python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: true
      - key: DEFAULT_SENDER
        sync: false
